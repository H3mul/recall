[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recall"
version = "0.1.0"
description = "Record all: supervised multitrack capture with arecord"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "luma.oled>=3.12"
]

[project.scripts]
recall = "recall.cli:main"

[tool.mypy]
strict = true
python_version = "3.11"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
recall = ["fonts/*"]
