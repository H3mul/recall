# Example recall configuration. Copy to ~/.config/recall/config.toml or pass with -c.
# Check it with: recall -c config.example.toml --check
# Unknown keys are errors.

# Absolute path of the directory recordings go to. It must already exist: recall never
# creates it and does not inspect its filesystem. If it disappears while recording,
# recall stops with exit status 69.
output_dir = "/mnt/recordings/recall"

# Show the SSD1306 status display (default: false).
# display = true

[device]
# Regular expressions searched in each `arecord -l` line. List order wins,
# then the lowest card number. Empty or omitted: the first capture device.
match = ["XR18", "X18"]
# Optional ceilings. Default: every channel and the best rate the device offers.
# max_channels = 18
# max_rate = 48000

[capture]
bit_depth = 24       # 16, 24 or 32; the device's deepest format if it lacks this
chunk_seconds = 900  # also capped so a chunk stays under 4 GB
stall_seconds = 10   # no output growth for this long means rebind
